name: Gerçek veriyi GBIF ve iNaturalist'ten çek

# Bu iş akışı yalnızca bu ortamdan (geliştirme konteyneri egress'i büyük ölçüde
# engelliyor) DEĞİL, GitHub Actions runner'ından çalışır — gerçek internet
# erişimiyle. GBIF'ten Türkiye'nin damarlı bitki taksonomisini ve yayılış
# kayıtlarını, iNaturalist'ten lisanslı fotoğrafları çeker; ayrıca EEA'nın
# EUNIS habitat sınıflandırmasını (commit'li data/eunis/*.xlsx — otomatik
# indirilemiyor, bkz. data/eunis/README.md) tür adına göre eşleştirir. Sonucu
# data/gbif-snapshot/ altında commit'ler. Bir sonraki normal dağıtım
# (deploy-pages.yml, her push'ta çalışır) bu anlık görüntüyü örnek veri yerine
# otomatik kullanır — bkz. scripts/select-dataset.mjs.
#
# Tüm Türkiye florası için tam çalıştırma SAATLER sürebilir (özellikle
# iNaturalist adımı, nezaket sınırı nedeniyle). Bu yüzden:
#   - Her adım kendi kontrol noktasını data/raw/gbif/ altına yazar (kesintiye
#     dayanıklı) ve actions/cache ile çalıştırmalar arasında korunur.
#   - `workflow_dispatch` ile manuel tetiklenirken `species_limit` girdisiyle
#     küçük bir alt kümeyle hızlı bir doğrulama (duman testi) yapılabilir.
on:
  push:
    branches:
      - claude/turkiye-botanik-haritasi-di1550
    paths:
      - 'scripts/ingest/gbif-taxonomy.mjs'
      - 'scripts/ingest/gbif-occurrences.mjs'
      - 'scripts/ingest/inaturalist-images.mjs'
      - 'scripts/ingest/eunis-habitats.mjs'
      - 'scripts/ingest/build-real-dataset.mjs'
      - 'scripts/ingest/lib/**'
      - '.github/workflows/refresh-data.yml'
  workflow_dispatch:
    inputs:
      species_limit:
        description: 'Yalnızca en çok kayıtlı ilk N türü işle (boş = tüm flora)'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 360 = GitHub barındırmalı runner'lar için izin verilen mutlak üst sınır.
    timeout-minutes: 360
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Paylaşılan paketi derle
        run: npm run build -w @trbotanik/shared

      - name: Önceki ilerlemeyi geri yükle
        uses: actions/cache/restore@v4
        with:
          path: data/raw/gbif
          # v2: ilk tam ölçekli çalıştırma (run 30431141095) saatler süren bir
          # GBIF 429 fırtınasında iptal edildi ve o çalıştırmanın kontrol
          # noktasında, başarısız türlerin "sıfır kayıt" olarak yanlış
          # kalıcılaştığı bir hataya rastlandı (artık düzeltildi, bkz.
          # gbif-occurrences.mjs). Önbellek anahtarı kasıtlı olarak
          # değiştirildi ki o şüpheli veri asla geri yüklenmesin — temiz bir
          # sayfa ile (yalnızca ~15 dk süren taksonomi adımı yeniden
          # çalışacak) yeniden başlanıyor.
          key: gbif-raw-v2-${{ github.run_id }}
          restore-keys: |
            gbif-raw-v2-

      - name: Tür anahtarlarını keşfet ve tür kayıtlarını çek (GBIF)
        run: npm run data:gbif-taxonomy
        env:
          # Duman testi (150 tür, run 30430435091) uçtan uca başarıyla tamamlandı —
          # sınır kaldırıldı. Boş değer = tüm Türkiye florası (13.319 tür keşfedildi).
          GBIF_SPECIES_LIMIT: ${{ github.event.inputs.species_limit }}

      - name: Yayılış kayıtlarını çek (GBIF)
        run: npm run data:gbif-occurrences

      - name: Lisanslı fotoğrafları ara (iNaturalist)
        run: npm run data:gbif-images

      - name: İlerlemeyi önbelleğe kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/gbif
          key: gbif-raw-v2-${{ github.run_id }}

      - name: EUNIS habitat kodlarını eşleştir
        # Commit'li data/eunis/*.xlsx'i okur, ağ gerektirmez (bkz. o klasördeki
        # README — EEA'nın sitesi otomatik indirmeye kapalı, dosya elle eklendi).
        # `continue-on-error`: bu iyi-niyet (best-effort) zenginleştirme adımıdır;
        # ileride dosya/şema bir sorun çıkarırsa asıl GBIF/iNaturalist zincirini
        # ve yayını bloke etmemeli — build-real-dataset.mjs kontrol noktası
        # eksikse sessizce atlar (tüm türler "henüz küratörlenmedi" kalır).
        continue-on-error: true
        run: npm run data:eunis-habitats

      - name: Anlık görüntüyü üret
        run: npm run data:gbif-build

      - name: Anlık görüntüyü commit'le ve push'la
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gbif-snapshot
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: GBIF/iNaturalist anlık görüntüsünü yenile"
          # Bu adım saatlerce sürebilen bir işin (özellikle iNaturalist görsel
          # taraması) sonunda çalışır; o süre boyunca dala başka push'lar
          # gelmiş olabilir (run 30696210953'te tam olarak bu oldu — 5 saatlik
          # bir görsel taraması, alakasız iki UI commit'i araya girdiği için
          # push reddedildi ve TÜM emek kayboldu). Reddedilirse en son dalı
          # çekip üzerine rebase edip yeniden dener — data/gbif-snapshot dışında
          # hiçbir şeye dokunmadığımız için çakışma riski düşük.
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push reddedildi (deneme $attempt/3) — en son dal çekilip yeniden deneniyor."
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }}
          done
          echo "3 denemeden sonra push başarısız oldu." >&2
          exit 1

      - name: Yeni veriyle yayını tetikle
        # GitHub, bir iş akışı içinden yapılan push'ların BAŞKA `on: push`
        # iş akışlarını (deploy-pages.yml dahil) tetiklemesini kasıtlı olarak
        # engeller (sonsuz döngüyü önlemek için) — yukarıdaki push bu yüzden
        # deploy-pages.yml'yi kendiliğinden tetiklemez. Site bir sonraki
        # insan commit'ine kadar eski veriyle kalmasın diye deploy-pages.yml
        # burada API üzerinden AÇIKÇA tetikleniyor.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref ${{ github.ref_name }}
